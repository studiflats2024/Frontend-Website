<div class="contact-section">
  <div class="contact-info">
    <h3>Contact Us</h3>
    <h2>Get In Touch With Us</h2>
    <p>We’re here to help! Whether you have questions, need support with your booking, or want to share feedback, our team is ready to assist.</p>
    <div class="contact-details">
      <div class="contact-item ">
        <div class="icon justify-content-center align-items-center"> <img class="mb-3" src="houseicon.svg"  /> </div>
        <div>
          <h4>Our Location</h4>
          <p>Spandauer Damm 115, 14050 Berlin</p>
        </div>
      </div>
      <div class="contact-item">
        <div class="icon justify-content-center align-items-center"> <img class="mb-3"   src="phoneicon.png" alt="ringer-volume"/></div>
        <div>
          <h4>Phone Number</h4>
          <p>+49 1520 3290607</p>
        </div>
      </div>
      <div class="contact-item">
        <!-- <div class="icon"><i class="fas fa-envelope"></i></div> -->
        <div class="icon justify-content-center align-items-center"> <img class="mb-3" src="emailicon.png"  /> </div>
        <div>
          <h4>Email Address</h4>
          <p>Info&#64;studiflats.de</p>
        </div>
      </div>
    </div>
  </div>
  <div class="contact-form">
    <form>
      <div class="form-group">
        <input type="text" class="form-control" placeholder="Your Name">
      </div>
      <div class="form-group">
        <input type="email" class="form-control" placeholder="Your Email">
      </div>
      <div class="form-group">
        <input type="text" class="form-control" placeholder="Your Phone">
      </div>
      <div class="form-group">
        <textarea class="form-control" rows="4" placeholder="Your Message"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send Message</button>
    </form>
  </div>
</div>
<app-footer></app-footer>
