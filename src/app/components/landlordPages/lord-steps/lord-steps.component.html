
<div  class="parent">

<!-- <div class="row"> -->

<div class="stepsDiv   ">
  <ul class="titles">
    <li *ngFor="let step of steps; let i = index"  >
      <span class="spanOne">{{ step.label }}</span>
      <span [ngClass]="{  'blue-class': i <= activeIndex, 'gray-class': i > activeIndex  }">{{ step.title }}</span>
      <span class="span3">{{ step.description }}</span>
    </li>
  </ul>

  <p-steps #stepper  [(activeIndex)]="activeIndex" [model]="steps" class="custom-steps"  orientation="vertical" (activeIndexChange)="onStepChange()"></p-steps>
</div>







<div class="page ">
  <!-- This is where the dynamic component will be inserted -->
<div dynamicHost></div>

<!-- Navigation buttons -->
 <div *ngIf="!hideNext" class="divider"></div>
<div class="navigation-buttons">
  <button [ngStyle]="{ visibility: activeIndex > 0 ? 'visible' : 'hidden' }" (click)="prev()"  ><img src="prev-arrow.svg"/>Previous</button><!--[disabled]="activeIndex === 0"-->
  <button *ngIf="!hideNext" (click)="next()" [disabled]="activeIndex === steps.length ">Next<img src="next-arrow.svg"/></button>
</div>

</div>


<!-- </div> -->
</div>





<!------------------------------confirm booking modal----------------->


<div class="modal " id="loginModal" tabindex="-1"  role="dialog" [ngStyle]="{'display': displayModalsuccess}" style="background-color: rgb(23 22 22 / 50%);">
  <div class="modal-dialog">
    <div class="modal-header"  >

      <!-- <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="color:#F0F6FF">
        <span aria-hidden="true" >&times;</span>
      </button> -->
    </div>
    <div class="modal-content">
      <div class="modal-body p-0">
        <button aria-hidden="true" style="position: absolute; top:0; right:0; background-color: transparent; border:none;" (click)="onCloseQrModal()">×</button>
        <div class="send-success-container">
          <div class="modal-form-section-success ">
            <div class="modal-header-success p-0">
              <div class="content-success">
                <div class="text-and-supporting-text-success">
                  <div class="featured-icon" style="position: relative;">
                    <img src="Ellipse.svg"/>
                    <div style="position: absolute; top:-10px; left:20px;">
                    <img src="image.png" />
                    </div>
                  </div>
                  <div class="frame-success">
                    <div class="text-successs">Congratulations!</div>
                    <div class="supporting-text-success">Your request has been sent successfully</div>
                    <div class="info-text-success">
                      Thank you for your request. It is currently under review, and one of our agents will reach out to you shortly to gather more details.
                    </div>
                  </div>
                </div>
              </div>
              <!-- <div class="button-close-x" data-bs-dismiss="modal">
                <div class="icon-close"></div>
              </div> -->
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
