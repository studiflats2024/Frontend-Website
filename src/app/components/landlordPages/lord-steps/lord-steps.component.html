
<div style="height: 120px;"></div>

<p-steps #stepper [(activeIndex)]="activeIndex" [model]="steps" class="custom-steps"></p-steps>







<!-- This is where the dynamic component will be inserted -->
<div dynamicHost></div>

<!-- Navigation buttons -->
<div class="navigation-buttons">
  <button (click)="prev()" [disabled]="activeIndex === 0">Previous</button>
  <button (click)="next()" [disabled]="activeIndex === components.length - 1">Next</button>
</div>
