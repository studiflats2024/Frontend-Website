<div class="search-bar">
  <div class="search-fields">
    <div class="field">
      <label for="city">City</label>
      <input type="text" id="city" placeholder="Where are you going?">
    </div>
    <div class="field">
      <label for="check-in date">Check in</label>
      <!-- <input type="date" id="check-in" placeholder="Add dates"> -->
      <input type="text" class="date-input" placeholder="Add dates" aria-label="Check in">
    </div>
    <div class="field date">
      <label for="check-out">Check out</label>
      <!-- <input type="date" id="check-out" placeholder="Add dates"> -->
      <input type="text" class="date-input" placeholder="Add dates" aria-label="Check out">
    </div>
    <div class="field">
      <label for="guests">Guests</label>
      <input type="number" id="guests" placeholder="Add guests">
    </div>
    <div class="field">
      <button class="search-button"><i class="fa fa-search"></i> Search</button>
    </div>
  </div>
</div>
