
<div style="height: 85px;  background: var(--Neutral-Neutral95, #F6F6F6);"></div>
<p-breadcrumb class="max-w-full" [model]="items">
  <ng-template pTemplate="item" let-item>
      <a [routerLink]="item.routerLink" class="p-menuitem-link" routerLinkActive="text-primary font-semibold">
          <span *ngIf="item.icon" [ngClass]="item.icon" class="mr-2"></span>
          <span>{{ item.label }}</span>
      </a>
  </ng-template>
</p-breadcrumb>
<div class="main-container row g-5"   >



<div class="col-lg-3 col-md-6 col-sm-1">

  <app-app-sider></app-app-sider>
</div>



  <div class="col-lg-9 col-md-6 col-sm-11">
    <div *ngIf="showNoBookingAlert" class="alert alert-info" role="alert">
      No bookings found .
    </div>
    <div *ngIf="!showNoBookingAlert">
    <p-card  *ngFor="let booking of bookings"  [style]="{ width: '360px' }" [routerLink]="['/booking-details', booking.booking_ID]">
      <ng-template pTemplate="header">
          <img alt="Card" [src]="booking.apartment_Image" />
      </ng-template>


      <div class="booking-card">
        <div class="head">
          <h3>{{ booking.apartment_Name }}</h3>
          <span class="status" [ngClass]="booking.bookingStatus.toLowerCase()">
            {{ booking.bookingStatus }}
          </span>
        </div>
        <p class="location">
          <i class="pi pi-map-marker" style="color:#4C4DDC"></i> {{ booking.apartment_Location }}
        </p>
        <div class="dates">
          <div class="checkin">
            <p class="label">Check In</p>
            <p class="date">{{ booking.check_In | date: 'dd MMM yyyy' }}</p>
          </div>
          <div class="divider"></div>
          <div class="checkout">
            <p class="label">Check Out</p>
            <p class="date">{{ booking.check_Out | date: 'dd MMM yyyy' }}</p>
          </div>
        </div>
      </div>

      <!-- <ng-template pTemplate="footer">
          <div class="flex gap-3 mt-1">
              <p-button label="Cancel" severity="secondary" class="w-full" styleClass="w-full" />
              <p-button label="Save" class="w-full" styleClass="w-full" />
          </div>
      </ng-template> -->
  </p-card>
</div>
  </div>


</div>
